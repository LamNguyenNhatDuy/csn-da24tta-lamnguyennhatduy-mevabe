<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Mẹ & Bé</title>
    <link rel="stylesheet" href="../../css/css-dangki-dangnhap/auth.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="login.html" class="logo">
                <span class="logo-icon">👶</span>
                <span class="logo-text">Mẹ & Bé</span>
            </a>
            
            <nav class="nav">
                <a href="login.html" class="nav-link">Đăng nhập</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card auth-card">
            <h1 class="page-title">Khôi Phục Mật Khẩu</h1>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="forgot-email" class="form-label">Email hoặc Số điện thoại đã đăng ký</label>
                    <input type="text" id="forgot-email" class="form-input" placeholder="Nhập email hoặc SĐT..." required>
                </div>

                <div class="form-group">
                    <label for="new-password" class="form-label">Mật khẩu mới</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Nhập mật khẩu mới..." required>
                </div>

                <div class="form-group">
                    <label for="confirm-new-password" class="form-label">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm-new-password" class="form-input" placeholder="Nhập lại mật khẩu mới..." required>
                </div>

                <div id="forgot-error" class="error-message"></div>

                <button type="submit" class="btn-primary">Cập Nhật Mật Khẩu</button>
            </form>

            <div class="auth-footer">
                <p>Đã nhớ lại mật khẩu? <a href="login.html" class="auth-link">Đăng nhập</a></p>
            </div>
        </section>
    </main>

    <script src="../../js/js-dangki-dangnhap/auth.js"></script>
</body>
</html>
