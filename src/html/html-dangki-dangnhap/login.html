<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Mẹ & Bé</title>
    <link rel="stylesheet" href="../../css/css-dangki-dangnhap/auth.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="login.html" class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">Mẹ & Bé</span>
            </a>
            
            <nav class="nav">
                <a href="register.html" class="nav-link">Đăng ký tài khoản</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card auth-card">
            <h1 class="page-title">Đăng Nhập Hệ Thống</h1>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email hoặc Số điện thoại</label>
                    <input type="text" id="login-email" class="form-input" placeholder="Nhập email hoặc SĐT..." required>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Mật khẩu</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Nhập mật khẩu..." required>
                </div>

                <div class="auth-footer" style="margin-top: 0; margin-bottom: 12px; text-align: right;">
                    <a href="forgot-password.html" class="auth-link" style="font-size: 0.85rem;">Quên mật khẩu?</a>
                </div>

                <div id="login-error" class="error-message"></div>

                <button type="submit" class="btn-primary">Đăng Nhập</button>
            </form>

            <div class="auth-footer">
                <p>Chưa có tài khoản? <a href="register.html" class="auth-link">Đăng ký ngay</a></p>
            </div>
        </section>
    </main>

    <script src="../../js/js-dangki-dangnhap/auth.js"></script>
</body>
</html>
