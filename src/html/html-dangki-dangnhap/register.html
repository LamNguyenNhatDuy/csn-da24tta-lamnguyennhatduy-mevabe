<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Mẹ & Bé</title>
    <link rel="stylesheet" href="../../css/css-dangki-dangnhap/auth.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="login.html" class="logo">
                <span class="logo-icon">👶</span>
                <span class="logo-text">Mẹ & Bé</span>
            </a>
            
            <nav class="nav">
                <a href="login.html" class="nav-link">Đăng nhập</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card auth-card">
            <h1 class="page-title">Đăng Ký Tài Khoản</h1>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-fullname" class="form-label">Họ và tên</label>
                    <input type="text" id="reg-fullname" class="form-input" placeholder="Nhập họ và tên..." required>
                </div>

                <div class="form-group">
                    <label for="reg-email" class="form-label">Email hoặc Số điện thoại</label>
                    <input type="text" id="reg-email" class="form-input" placeholder="Nhập email hoặc SĐT..." required>
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Mật khẩu</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Tạo mật khẩu..." required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu..." required>
                </div>

                <div class="form-group">
                    <label for="reg-role" class="form-label">Vai trò sử dụng</label>
                    <select id="reg-role" class="form-select" required>
                        <option value="khachhang">Khách Hàng</option>
                        <option value="nhanvien">Nhân Viên</option>
                        <option value="chucoso">Chủ Cơ Sở</option>
                    </select>
                </div>

                <div id="register-error" class="error-message"></div>

                <button type="submit" class="btn-primary">Tạo Tài Khoản</button>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="login.html" class="auth-link">Đăng nhập</a></p>
            </div>
        </section>
    </main>

    <script src="../../js/js-dangki-dangnhap/auth.js"></script>
</body>
</html>
